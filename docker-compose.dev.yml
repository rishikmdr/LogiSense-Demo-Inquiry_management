version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: logisense_ims
      POSTGRES_USER: logisense
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logisense -d logisense_ims"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
